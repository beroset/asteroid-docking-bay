# NetworkManager: leave watch USB-NCM interfaces alone.
#
# Install to /etc/NetworkManager/conf.d/90-asteroid-docking-bay-ncm.conf
#
# These interfaces are not networks — they are one watch each, reached over an
# IPv6 link-local. NetworkManager claims them as ordinary ethernet, parks them
# in "disconnected" with no profile, assigns nothing, and sets
# addr_gen_mode=1 ("none"), which stops the kernel generating the link-local
# too. The interface then has no IPv6 address at all and there is no source
# address to reach the watch from.
#
# Marking them unmanaged restores the kernel defaults, and the udev rule in
# 70-asteroid-docking-bay.rules brings the link up and ensures
# addr_gen_mode=0. Nothing else about the host's networking is affected: this
# matches on the cdc_ncm driver, which only watch gadgets use here.
#
# After installing:
#   sudo systemctl reload NetworkManager
[keyfile]
unmanaged-devices=driver:cdc_ncm
